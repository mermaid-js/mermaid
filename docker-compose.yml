services:
  mermaid:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    working_dir: /mermaid
    mem_limit: '8G'
    env_file:
      - .env
    volumes:
      - ./:/mermaid
      - root_cache:/root/.cache
      - root_local:/root/.local
      - root_npm:/root/.npm
      - /tmp:/tmp
    ports:
      - ${MERMAID_PORT}:${MERMAID_PORT}
      - 3333:3333

volumes:
  root_cache:
  root_local:
  root_npm:
