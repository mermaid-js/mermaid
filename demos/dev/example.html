<!DOCTYPE html>
<html>
  <head>
    <title>Mermaid development page</title>
    <style>
      .container {
        display: flex;
        flex-direction: row;
      }

      #code {
        max-width: 30vw;
        width: 30vw;
      }

      #dynamicDiagram {
        padding-left: 2em;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <pre id="diagram" class="mermaid">
graph TB
      a --> b
      a --> c
      b --> d
      c --> d
      </pre>
      <pre class="mermaid">info</pre>
    </div>

    <hr />
    Type code to view diagram:
    <div class="container">
      <textarea name="code" id="code" cols="30" rows="10"></textarea>
      <div id="dynamicDiagram"></div>
    </div>

    <table>
      <tbody>
        <tr>
          <th scope="row">Error</th>
          <td>
            <pre><code id="errors"></code></pre>
          </td>
        </tr>
        <tr>
          <th scope="row">Render time</th>
          <td>
            <time id="renderTime">N/A</time>
          </td>
        </tr>
      </tbody>
    </table>

    <script type="module">
      import mermaid from '/mermaid.esm.mjs';

      function setRenderTime(start, end) {
        const durationMs = end - start;
        document
          .getElementById('renderTime')
          .setAttribute('datetime', `PT${(durationMs / 1000).toFixed(3)}s`);
        document.getElementById('renderTime').innerText = new Intl.NumberFormat('en', {
          style: 'unit',
          unit: 'millisecond',
        }).format(durationMs);
      }

      async function render(str) {
        const start = performance.now();
        try {
          const { svg } = await mermaid.render('dynamic', str);
          const end = performance.now();
          document.getElementById('dynamicDiagram').innerHTML = svg;
          document.getElementById('errors').innerText = 'No errors';
          setRenderTime(start, end);
        } catch (err) {
          const end = performance.now();
          document.getElementById('errors').innerText = err;
          setRenderTime(start, end);
        }
      }
      const storeKey = window.location.pathname;
      const code = localStorage.getItem(storeKey);
      mermaid.initialize({
        startOnLoad: true,
        logLevel: 0,
      });
      document.getElementById('code').addEventListener('input', async (e) => {
        const value = e.target.value;
        localStorage.setItem(storeKey, value);
        await render(value);
      });
      if (code) {
        document.getElementById('code').value = code;
        await render(code);
      }
    </script>
  </body>
</html>
