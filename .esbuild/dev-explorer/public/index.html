<!doctype html>
<html lang="en" class="sl-theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mermaid Dev Explorer</title>

    <link rel="stylesheet" href="/dev/vendor/shoelace/themes/dark.css" />
    <link rel="stylesheet" href="/dev/styles.css?v=8" />
  </head>
  <body>
    <!-- Mermaid ESM + ELK layout loaders (required for `layout: 'elk'`) -->
    <script type="module">
      // Expose a single async hook so the app can reliably await Mermaid "activation".
      // This avoids races where the UI calls initialize/render before layouts/diagrams are ready.
      window.mermaidReady = (async () => {
        try {
          const [{ default: mermaid }, { default: layouts }] = await Promise.all([
            import('/mermaid.esm.mjs'),
            import('/mermaid-layout-elk.esm.mjs'),
          ]);

          mermaid.registerLayoutLoaders(layouts);

          // Legacy Font Awesome syntax (`fa:fa-bell`, `fab:fa-twitter`, ...) falls back to
          // `<i class="fa fa-bell">`/`<i class="fab fa-twitter">` elements whenever no matching
          // iconify pack is registered (see createText.ts's isIconAvailable/getIconSVG fallback).
          // Loading the real Font Awesome webfont CSS covers every prefix (fa/fab/fas/far/fal/fak)
          // in one step, matching what e2e/platform/viewer.js does for the Playwright test harness,
          // instead of registering separate iconify packs per prefix via a live unpkg fetch.
          const faLink = document.createElement('link');
          faLink.rel = 'stylesheet';
          faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css';
          document.head.appendChild(faLink);

          // Keep the rest of the dev explorer simple: expose mermaid on window for the Lit components.
          window.mermaid = mermaid;
          return mermaid;
        } catch (err) {
          console.error('[dev-explorer] Failed to initialize mermaid (ESM + elk loaders).', err);
          throw err;
        }
      })();
    </script>

    <dev-explorer-app></dev-explorer-app>

    <script type="module" src="/dev/assets/explorer-app.js?v=8"></script>
  </body>
</html>
