name: Refresh screenshot sheet order

# Compacts cypress/sheet-order.json: the e2e batcher appends new screenshots at
# their group's tail and leaves blank cells for removed tests, which keeps churn
# low but lets gaps/appended tails accumulate. This job re-derives the manifest
# from a full screenshot capture (prune removed, fold the appended tail into
# stable order) and opens a PR — so the compaction lands as one reviewed change
# rather than a direct push to the protected develop branch.

on:
  # Weekly, and on demand from the Actions tab.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: ${{ github.repository == 'mermaid-js/mermaid' }}
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.16.0-chrome-127.0.6533.88-1-ff-128.0.3-edge-127.0.2651.74-1
      options: --user 1001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        uses: cypress-io/github-action@108b8684ae52e735ff7891524cbffbcd4be5b19f # v6.7.16
        with:
          runTests: false

      # Full suite in a single container so every group is captured. useArgos
      # (RUN_VISUAL_TEST) makes verifyScreenshot capture PNGs to cypress/screenshots
      # without uploading — exactly the input the order manifest is built from.
      - name: Capture screenshots
        uses: cypress-io/github-action@108b8684ae52e735ff7891524cbffbcd4be5b19f # v6.7.16
        with:
          install: false
          start: pnpm run dev
          wait-on: 'http://localhost:9000'
          browser: chrome
          publish-summary: false
        env:
          RUN_VISUAL_TEST: 'true'
          CYPRESS_COMMIT: ${{ github.sha }}
          SPLIT: 1
          SPLIT_INDEX: 0

      - name: Regenerate sheet order
        run: |
          pnpm screenshots canonicalize
          pnpm screenshots order

      - name: Create pull request
        uses: peter-evans/create-pull-request@d32e88dac789dcc7906e7d26f69f24116fa9c97d
        with:
          add-paths: |
            cypress/sheet-order.json
          commit-message: 'chore: refresh screenshot sheet order'
          branch: refresh-sheet-order
          title: Refresh screenshot sheet order
          body: |
            Compacts `cypress/sheet-order.json` — prunes removed tests (blank cells)
            and folds newly-appended screenshots into stable order. Generated by the
            "Refresh screenshot sheet order" workflow.
          delete-branch: true
          sign-commits: true
