name: Refresh screenshot sheet order

# Compacts e2e/sheet-order.json: the e2e batcher appends new screenshots at their
# group's tail and leaves blank cells for removed tests, which keeps churn low but
# lets gaps/appended tails accumulate over time. This job re-derives the manifest
# from a full screenshot capture (prune removed, fold the appended tail into stable
# order) and opens a PR — so the compaction lands as one reviewed change rather
# than a direct push to the protected develop branch.

on:
  # Weekly, and on demand from the Actions tab.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: ${{ github.repository == 'mermaid-js/mermaid' }}
    runs-on: ubuntu-latest
    # Same image as the e2e job so the capture matches what CI produces. Keep the
    # tag in sync with @playwright/test in package.json (Renovate bumps both).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Full single-shard capture of the whole suite — generous bound for a weekly job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # The dev server (Playwright's webServer) serves the package bundles, which
      # --ignore-scripts skipped — build them first.
      - name: Build
        run: pnpm build

      # Capture every screenshot under e2e/screenshots. RUN_VISUAL_TEST makes
      # verifyScreenshot write PNGs (no upload, no visual assertion). Do not
      # swallow failures: a partial capture would prune missing tests from the
      # manifest as if they had been removed.
      - name: Capture screenshots (full suite)
        run: pnpm exec playwright test
        env:
          MERMAID_PORT: 9000
          RUN_VISUAL_TEST: 'true'

      - name: Regenerate sheet order
        run: pnpm run screenshots:order

      - name: Create pull request
        uses: peter-evans/create-pull-request@d32e88dac789dcc7906e7d26f69f24116fa9c97d # v8.1.1
        with:
          add-paths: |
            e2e/sheet-order.json
          commit-message: 'chore(e2e): refresh screenshot sheet order'
          branch: refresh-sheet-order
          title: Refresh screenshot sheet order
          body: |
            Compacts `e2e/sheet-order.json` — prunes removed tests (blank cells)
            and folds newly-appended screenshots into stable order. Generated by the
            "Refresh screenshot sheet order" workflow.
          delete-branch: true
          sign-commits: true
