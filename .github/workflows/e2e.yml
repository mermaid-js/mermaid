name: E2E

on:
  push:
    branches:
      - develop
      - master
      - release/**
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      group_argos_images:
        description: Composite screenshots into batched sheets before Argos upload
        type: boolean
        default: true
      spec_pattern:
        description: Playwright spec glob (empty = full suite)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs for the same PR; never cancel push / merge_group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The e2e job runs inside the Playwright container, whose default shell is
# sh (dash). Force bash everywhere so the run steps' bash-isms (here-strings,
# mapfile, brace expansion, `set -euo pipefail`) parse correctly.
defaults:
  run:
    shell: bash

env:
  # For PRs and MergeQueues, the target commit is used, and for push events to non-develop branches, github.event.previous is used if available. Otherwise, the repo default branch is used.
  targetHash: >-
    ${{
      github.event_name == 'workflow_dispatch' && github.event.repository.default_branch ||
      github.event.pull_request.base.sha ||
      github.event.merge_group.base_sha ||
      (
        (
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          github.event.before == '0000000000000000000000000000000000000000'
        ) && github.event.repository.default_branch
      ) ||
      github.event.before
    }}
  RUN_VISUAL_TEST: >-
    ${{ github.repository == 'mermaid-js/mermaid' && (github.event_name == 'workflow_dispatch' || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')) }}
  # Automatic runs always batch; manual runs can upload per-screenshot instead.
  GROUP_ARGOS_IMAGES: >-
    ${{
      github.event_name != 'workflow_dispatch' && 'true' ||
      (inputs.group_argos_images && 'true' || 'false')
    }}
  # On a push to the baseline branch (develop), upload BOTH the grouped sheets
  # and the individual per-test screenshots in a single Argos build, so the
  # default build's baseline is a superset. Scoped grouped PRs and manual
  # per-screenshot runs then both diff cleanly against it (each marked --subset).
  ARGOS_UPLOAD_BOTH: >-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
  # Shard JSON for a full-suite run vs a scoped (single-container) run.
  E2E_FULL_MATRIX: '[1,2,3,4,5,6,7,8]'
  E2E_SCOPED_MATRIX: '[1]'

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
      - name: Cache snapshots
        id: cache-snapshot
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ./e2e/snapshots
          key: ${{ runner.os }}-snapshots-${{ env.targetHash }}

      # If a snapshot for a given Hash is not found, we checkout that commit, run the tests and cache the snapshots.
      - name: Switch to base branch
        if: ${{ steps.cache-snapshot.outputs.cache-hit != 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.targetHash }}

      - name: Install dependencies
        if: ${{ steps.cache-snapshot.outputs.cache-hit != 'true' }}
        run: pnpm install --ignore-scripts

      - name: Calculate bundle size
        if: ${{ steps.cache-snapshot.outputs.cache-hit != 'true'}}
        run: |
          pnpm run build:viz
          mkdir -p e2e/snapshots/stats/base
          mv stats e2e/snapshots/stats/base

  # Detect which diagram(s) the PR touches and determine the minimal set of
  # specs to run.
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      spec_pattern: ${{ steps.scope.outputs.spec_pattern }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Need enough history to diff against the base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'

      - name: Detect e2e scope
        id: scope
        env:
          # Manual-dispatch spec glob, passed via env to avoid interpolating
          # user input directly into the shell script.
          SPEC_PATTERN_INPUT: ${{ github.event.inputs.spec_pattern }}
          TARGET_HASH: ${{ env.targetHash }}
          # PRs use base.ref (`master` / `develop`); merge_group uses `refs/heads/...`.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
          # Scoping is ON by default.  To disable, set this repository variable
          # to 'false' (GitHub → Settings → Secrets and variables → Actions → Variables).
          # Using == 'false' (instead of == 'true') ensures fork PRs — where
          # repository variables are not exposed — still get scoped runs.
          E2E_SCOPE_BY_DIAGRAM: "${{ vars.E2E_SCOPE_BY_DIAGRAM == 'false' && 'false' || 'true' }}"
        run: |
          # Multiline GITHUB_OUTPUT so a glob can't inject extra keys. Empty
          # values use `key=` — a heredoc with a blank line is a non-empty
          # newline and would look like a spec pattern to the e2e job.
          set_output() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              printf '%s=\n' "$key" >> "$GITHUB_OUTPUT"
              return
            fi
            local delim
            delim="ghadelim_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }

          emit_full() {
            set_output spec_pattern ""
            set_output matrix "$E2E_FULL_MATRIX"
          }

          emit_skip() {
            set_output spec_pattern "SKIP"
            set_output matrix "$E2E_SCOPED_MATRIX"
          }

          emit_scoped() {
            set_output spec_pattern "$1"
            set_output matrix "$E2E_SCOPED_MATRIX"
          }

          # Manual runs can target a specific spec glob via the workflow_dispatch
          # input; an empty pattern runs the full suite.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$SPEC_PATTERN_INPUT" ]; then
              emit_scoped "$SPEC_PATTERN_INPUT"
              echo "[detect-scope] Manual run scoped to: ${SPEC_PATTERN_INPUT}"
            else
              emit_full
              echo "[detect-scope] Manual run — full suite."
            fi
            exit 0
          fi

          # Kill-switch: set the repo variable E2E_SCOPE_BY_DIAGRAM to 'false'
          # to disable scoping.  Scoping is ON by default so that fork PRs
          # (where repository variables are unavailable) still benefit from it.
          if [ "${E2E_SCOPE_BY_DIAGRAM}" = "false" ]; then
            emit_full
            echo "[detect-scope] Scoping disabled via kill-switch — full suite."
            exit 0
          fi

          # For direct pushes to a long-lived branch, always run the full suite
          # (no PR diff to scope against).
          if [ "$TARGET_HASH" = "develop" ] || [ "$TARGET_HASH" = "master" ]; then
            emit_full
            echo "[detect-scope] Direct push to ${TARGET_HASH} — full suite."
            exit 0
          fi

          # Fetch the PR/merge-group base (not hardcoded develop) so scoping
          # works for PRs targeting master.
          BASE_REF="${BASE_REF#refs/heads/}"
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          fi
          git fetch origin "$TARGET_HASH" --depth=1 2>/dev/null || true
          MERGE_BASE=$(git merge-base HEAD "$TARGET_HASH" 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ] && [ -n "$BASE_REF" ]; then
            MERGE_BASE=$(git merge-base HEAD "origin/${BASE_REF}" 2>/dev/null || true)
          fi

          if [ -z "$MERGE_BASE" ]; then
            emit_full
            echo "[detect-scope] Could not determine merge-base — full suite."
            exit 0
          fi

          echo "[detect-scope] merge-base: ${MERGE_BASE} (base ref: ${BASE_REF:-none})"

          # Get changed files and run the detection script.
          SPEC=$(git diff --name-only "$MERGE_BASE" HEAD 2>/dev/null \
                 | node scripts/e2e-diagram-scope.mjs \
                 || echo "")

          if [ "$SPEC" = "SKIP" ]; then
            emit_skip
            echo "[detect-scope] Only docs/ignorable files changed — e2e can be skipped."
          elif [ -n "$SPEC" ]; then
            emit_scoped "$SPEC"
            echo "[detect-scope] Scoped to: ${SPEC}"
          else
            emit_full
            echo "[detect-scope] Cannot scope — full suite."
          fi

  e2e:
    # Skip the entire e2e job when only docs/ignorable files changed.
    if: needs.detect-scope.outputs.spec_pattern != 'SKIP'
    runs-on: ubuntu-latest
    # Browsers + OS libraries are baked into the official Playwright image, so no
    # `playwright install` / `install-deps` is needed at runtime. Keep this tag in
    # sync with the @playwright/test version in package.json (Renovate bumps both).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Bound the job so a hung dev server / wait-on fails in minutes, not at
    # GitHub's 6h default.
    timeout-minutes: 30
    needs: [cache, detect-scope]
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.detect-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'

      # These cached snapshots are downloaded, providing the reference snapshots.
      - name: Cache snapshots
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ./e2e/snapshots
          key: ${{ runner.os }}-snapshots-${{ env.targetHash }}

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # install ran with --ignore-scripts, so the package bundles the dev server
      # serves (mermaid.esm.mjs, mermaid-layout-elk.esm.mjs, …) aren't built.
      # Build them on every shard; shard 1 builds via build:viz in size-diff below.
      - name: Build
        if: ${{ matrix.containers != 1 }}
        run: pnpm build

      - name: Output size diff
        if: ${{ matrix.containers == 1 }}
        run: |
          pnpm run build:viz
          # `stats` (head) is always produced by build:viz; the base lives in the
          # restored snapshot cache. On a cache miss the dir is absent, so create
          # it before moving and treat the diff as informational — a missing
          # baseline must not fail the e2e shard.
          mkdir -p e2e/snapshots/stats
          mv stats e2e/snapshots/stats/head
          echo '## Bundle size difference' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          pnpm exec tsx scripts/size.ts >> "$GITHUB_STEP_SUMMARY" || echo '_Bundle size baseline unavailable (snapshot cache miss)._' >> "$GITHUB_STEP_SUMMARY"

      # Rebuild the served bundle with inline source maps so the Playwright run
      # can collect native V8 coverage and map it back to source (no
      # instrumentation). Gated to runs whose coverage is uploaded.
      - name: Build coverage bundle for e2e coverage
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
        run: pnpm build:coverage

      - name: Playwright run
        id: playwright
        env:
          MERMAID_PORT: 9000
          # Enables native V8 coverage collection (page.coverage) on coverage runs.
          E2E_COVERAGE: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') && 'true' || '' }}
          # Job output via env — never interpolate spec globs into the shell via ${{ }}.
          SPEC_PATTERN: ${{ needs.detect-scope.outputs.spec_pattern }}
          SHARD: ${{ matrix.containers }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          if [ -n "$SPEC_PATTERN" ]; then
            IFS=',' read -ra SPECS <<< "$SPEC_PATTERN"
            pnpm exec playwright test "${SPECS[@]}" --shard="${SHARD}/${SHARD_TOTAL}"
          else
            pnpm exec playwright test --shard="${SHARD}/${SHARD_TOTAL}"
          fi

      # On failure, surface why a diagram didn't render: traces (with browser
      # console), failure screenshots, and error-context snapshots.
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.containers }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

      # Hand the captured PNGs (grouped per spec under e2e/screenshots/) to the
      # argos-batch job, which composites + uploads them once.
      - name: Upload captured screenshots
        if: ${{ env.RUN_VISUAL_TEST == 'true' && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.containers }}
          path: e2e/screenshots/
          retention-days: 1
          if-no-files-found: ignore

      # Stash each shard's lcov; the host-based codecov-upload job uploads it
      # (the Playwright container lacks curl + gpg to upload directly).
      - name: Upload e2e coverage artifact
        if: ${{ steps.playwright.outcome == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-coverage-${{ matrix.containers }}
          path: coverage/playwright/lcov.info
          if-no-files-found: ignore
          retention-days: 1

  # Upload coverage from the host, where curl + gpg are available; the
  # Playwright container lacks them and can't install them (non-root).
  codecov-upload:
    needs: e2e
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download e2e coverage artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: e2e-coverage-*
          path: coverage-artifacts

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # v5.3.1
        with:
          directory: coverage-artifacts
          flags: e2e
          name: mermaid-codecov
          fail_ci_if_error: false
          verbose: true
          token: 6845cc80-77ee-4e17-85a1-026cd95e0766

  # Batch all per-container screenshots into folder-wise composite sheets and
  # upload them to Argos in a single build. PR / merge-queue runs upload only the
  # sheets; a push to develop additionally uploads the individual screenshots so
  # the baseline is a superset (see ARGOS_UPLOAD_BOTH).
  #
  # Only runs when the e2e matrix fully succeeded: a failed/partial e2e run would
  # otherwise upload an incomplete or wrong set of screenshots — and on develop
  # that set becomes the baseline. `needs.e2e.result == 'success'` requires every
  # shard to pass (the matrix is fail-fast: false, so its result is failure if any
  # shard failed).
  argos-batch:
    if: >-
      ${{
        github.repository == 'mermaid-js/mermaid' &&
        (github.event_name == 'workflow_dispatch' || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')) &&
        needs.detect-scope.outputs.spec_pattern != 'SKIP' &&
        needs.e2e.result == 'success'
      }}
    needs: [detect-scope, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download screenshot artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: e2e/screenshots

      # Automatic runs batch into sheets; a manual run with group_argos_images=false
      # uploads the per-screenshot PNGs instead. (No canonicalize step needed:
      # verifyScreenshot names each PNG by its spec-relative path, which is already
      # shard-independent — unlike Cypress's cypress-split shard naming.)
      #
      # Sheets are tiled in the committed order (e2e/sheet-order.json): new
      # screenshots append at their group's tail and removed ones leave a blank
      # cell, so adding/removing a test changes only that group's last/affected
      # sheet instead of cascading. Groups the manifest doesn't cover yet are tiled
      # in test-declaration order (read from the capture sidecars), so a test added
      # at the end of its spec still appends instead of re-sorting the group; tiles
      # whose sidecar is missing or unreadable fall back to source-path order at
      # the group's tail. The manifest is compacted periodically by the "Refresh
      # screenshot sheet order" workflow (opens a PR), not on every run.
      - name: Composite screenshots into per-spec sheets
        if: env.GROUP_ARGOS_IMAGES == 'true'
        run: pnpm run screenshots:sheets

      # Baseline branch (develop): merge the grouped sheets and the individual
      # screenshots into one tree and upload them as a SINGLE Argos build. The CLI
      # uploads one directory and names each screenshot relative to it, so merging
      # preserves both naming schemes — sheet names (<group>/<group>-NNN.png) and
      # individual names (<group>/<spec>.spec.js/<name>.png) never collide and match
      # exactly what grouped PR / manual runs upload. The default build thus becomes
      # a superset baseline both modes can diff against (each marked --subset).
      # No --subset here: a develop push runs the full suite and uploads both
      # representations, so this is the complete, authoritative baseline.
      #
      # Sent as a single Argos build, but split into K parallel uploads sharing one
      # nonce. Argos's PUT /builds/{buildId} finalize body inlines metadata for every
      # screenshot, so uploading the whole superset in one request exceeds the API
      # body limit ("request entity too large", HTTP 413). Each parallel index PUTs
      # only its slice; --files globs stay relative to the same root so names are
      # preserved, and Argos combines the indices into one build once all K report.
      # Merges sheets + screenshots into one upload root and splits the upload
      # into size-balanced parallel slices so no finalize body trips Argos's
      # request limit (HTTP 413) — see scripts/argos-upload-baseline.ts.
      - name: Upload images to Argos
        if: env.ARGOS_UPLOAD_BOTH == 'true'
        env:
          ARGOS_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm run argos:upload-baseline

      # PR / merge-queue / manual grouped runs: upload only the composite sheets.
      - name: Upload grouped sheets to Argos
        if: env.GROUP_ARGOS_IMAGES == 'true' && env.ARGOS_UPLOAD_BOTH != 'true'
        env:
          ARGOS_SUBSET: true
        run: pnpm run argos:upload-sheets

      # Manual per-screenshot runs (workflow_dispatch with group_argos_images=false).
      - name: Upload individual screenshots to Argos
        if: env.GROUP_ARGOS_IMAGES != 'true'
        env:
          ARGOS_SUBSET: true
        run: pnpm exec argos upload e2e/screenshots

  e2e-required:
    if: always()
    needs: [detect-scope, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify e2e outcome
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          SCOPE_RESULT: ${{ needs.detect-scope.result }}
          SPEC_PATTERN: ${{ needs.detect-scope.outputs.spec_pattern }}
        run: |
          echo "detect-scope result: ${SCOPE_RESULT}"
          echo "detect-scope spec_pattern: ${SPEC_PATTERN}"
          echo "e2e result: ${E2E_RESULT}"
          case "${E2E_RESULT}" in
            success|skipped)
              echo "OK — required check satisfied."
              ;;
            *)
              echo "FAIL — e2e matrix did not complete successfully."
              exit 1
              ;;
          esac
